<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Déclaration de l'encodage des caractères -->
    <meta charset="UTF-8">
    <!-- Configuration du viewport pour le responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Titre de la page qui s'affiche dans l'onglet du navigateur -->
    <title>PokéQuiz - Jeu</title>

    <!-- Lien vers le framework Bootstrap pour le styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lien vers la feuille de style personnalisée -->
    <link rel="stylesheet" href="css/jeu.css">

    <!-- Lien vers les icônes Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<!-- Application d'une couleur de fond personnalisée -->
<body style="background-color: hwb(34 84% 2%);">
   <!-- Container principal Bootstrap pour centrer et structurer le contenu -->
   <div class="container">

    <!-- ========== ÉCRAN DE DÉMARRAGE ========== -->
    <!-- Premier écran visible au chargement de la page -->
    <div id="start-screen" class="text-center">
        <!-- Titre principal avec icône -->
        <h1 class="text-primary">
            <i class="bi bi-stars"></i> PokéQuiz
        </h1>

        <!-- Bouton pour démarrer le jeu -->
        <button id="start-btn" onclick="demarrerJeu()" class="btn btn-primary btn-lg">
            <i class="bi bi-play-fill"></i> Commencer le Quiz !
        </button>

        <!-- Lien pour retourner au menu principal -->
        <div class="menu-link mt-3">
            <a href="index.html">
                <i class="bi bi-arrow-left-circle"></i> Retour au menu
            </a>
        </div>
    </div>

    <!-- Écran principal du quiz, caché au départ -->
    <div id="game-screen" class="hidden">
        <!-- Carte Bootstrap contenant tout le contenu du jeu -->
        <div class="card shadow p-3 mt-3">

            <!-- Conteneur pour l'image du Pokémon -->
            <div id="image-container" class="text-center mb-3">
                <!-- Image qui sera chargée dynamiquement via JavaScript -->
                <img id="question-image" src="" alt="Image Pokémon" class="question-image img-fluid">
            </div>

            <!-- Corps de la carte contenant la question et les réponses -->
            <div class="card-body">
                <!-- Texte de la question (rempli dynamiquement) -->
                <h3 id="question-text" class="text-center mb-3"></h3>
                <!-- Conteneur pour les boutons de réponses (générés dynamiquement) -->
                <div id="answers-container" class="q-grid"></div>
                <!-- Zone pour afficher les messages de résultat (correct/incorrect) -->
                <div id="result-message" class="alert mt-3"></div>
            </div>

            <!-- Section inférieure avec navigation et contrôles -->
            <div class="mt-3">
                <!-- Disposition flex pour aligner les éléments -->
                <div class="d-flex justify-content-between align-items-center">

                    <!-- Affichage de la pagination (question actuelle / total) -->
                    <div id="pagination-jeu" class="fw-bold"></div>

                    <!-- Boutons de contrôle du jeu -->
                    <div>
                        <!-- Bouton pour valider la réponse sélectionnée -->
                        <button id="validate-btn" onclick="verifierReponse()" class="btn btn-success btn-lg">
                            <i class="bi bi-check2-circle"></i> Valider
                        </button>

                        <!-- Bouton pour passer à la question suivante -->
                        <button id="next-btn" onclick="questionSuivante()" class="btn btn-primary btn-lg ">
                            <i class="bi bi-arrow-right-circle"></i> Suivant
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

  
    <!-- Écran affiché à la fin du quiz, caché au départ -->
    <div id="result-screen" class="hidden text-center mt-5">
        <!-- Icône de trophée pour symboliser la fin du jeu -->
        <div class="end-icon">
            <span><i class="bi bi-trophy-fill"></i></span>
        </div>

        <!-- Titre annonçant la fin du quiz -->
        <h2>Quiz Terminé !</h2>

        <!-- Carte affichant le score final et un message -->
        <div class="score-box card bg-light p-3 mt-3">
            <!-- Score final (rempli dynamiquement) -->
            <h3 id="score-final"></h3>
            <!-- Message personnalisé selon le score (rempli dynamiquement) -->
            <p id="message-final"></p>
        </div>

        <!-- Boutons de navigation en fin de jeu -->
        <div class="end-btns mt-4">
            <!-- Bouton pour recommencer le quiz -->
            <button onclick="rejouer()" class="btn btn-primary btn-lg">
                <i class="bi bi-arrow-repeat"></i> Rejouer
            </button>

            <!-- Bouton pour retourner au menu principal -->
            <a href="index.html" class="btn btn-outline-secondary btn-lg ms-2">
                <i class="bi bi-house-door-fill"></i> Menu
            </a>
        </div>
    </div>
</div>

    <!-- Script Bootstrap pour les fonctionnalités interactives -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script JavaScript personnalisé pour la logique du jeu -->
    <script src="js/jeu.js"></script>
</body>

</html>
